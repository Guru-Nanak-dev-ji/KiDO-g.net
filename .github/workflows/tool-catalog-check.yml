name: KiDO Tool Catalog Health Check
on:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check linked tool URLs
        run: |
          python3 - <<'PY'
          import re,urllib.request,json,datetime
          from pathlib import Path
          files=['writer-academy.html','creative-studio.html','government-portals.html']
          urls=set()
          for name in files:
              p=Path(name)
              if p.exists():
                  urls.update(re.findall(r'https?://[^"\s<>]+',p.read_text()))
          results=[]
          for url in sorted(urls):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (KiDO link audit)'},method='HEAD')
                  with urllib.request.urlopen(req,timeout=6) as resp:
                      results.append({'url':url,'status':resp.status,'ok':True})
              except Exception as e:
                  results.append({'url':url,'ok':False,'note':str(e)[:180]})
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'links':results,'note':'Failures may be due to bot blocking, not broken links. Human review required.'}
          Path('catalog-link-report.json').write_text(json.dumps(report,indent=2))
          print('Checked',len(results),'links; possible issues',sum(not r['ok'] for r in results))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kido-catalog-link-report
          path: catalog-link-report.json
          retention-days: 30

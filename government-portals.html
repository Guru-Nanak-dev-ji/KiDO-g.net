<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>भारत सरकारी पोर्टल | KiDO-G</title><style>body{margin:0;background:#140d09;color:#ffe0b2;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px}h1{color:#ffae4a}a{color:#ffd194}input{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #a66a35;background:#29180f;color:white;font:inherit}section{margin:24px 0}h2{font-size:19px;color:#ffbd6b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.item{display:block;padding:13px;border:1px solid #75451e;background:#27180f;border-radius:12px;text-decoration:none}.item:hover,.item:focus{background:#432612}small{color:#cda678;display:block;word-break:break-word;margin-top:5px}.note{color:#e5b780;font-size:13px;line-height:1.5}</style></head><body><main><a href="./index.html">← KiDO-G</a><h1>🇮🇳 भारत सरकार · पोर्टल डायरेक्टरी</h1><p class="note">सरकारी सेवाओं, मंत्रालयों, योजनाओं, परीक्षाओं और नीति आयोग के प्रमुख सार्वजनिक पोर्टल। यह चयनित डायरेक्टरी है, भारत के हर सरकारी पोर्टल की संपूर्ण सूची नहीं। आवेदन से पहले आधिकारिक साइट पर विवरण जाँचें। KiDO सरकारी संस्था नहीं है।</p><label for="q">🔎 सरकारी पोर्टल खोजें</label><input id="q" type="search" placeholder="जैसे UPSC, NITI, Aadhaar, GST, किसान, शिक्षा"><p id="count" class="note"></p><div id="directory"></div></main><script>const groups={"राष्ट्रीय पोर्टल":[["भारत सरकार राष्ट्रीय पोर्टल","https://www.india.gov.in"],["सेवाओं का राष्ट्रीय पोर्टल","https://services.india.gov.in"],["नीति आयोग","https://www.niti.gov.in"],["MyGov","https://www.mygov.in"],["PIB","https://pib.gov.in"],["Open Government Data","https://data.gov.in"],["ई-गजट","https://egazette.gov.in"],["डिजिटल इंडिया","https://www.digitalindia.gov.in"],["UMANG","https://web.umang.gov.in"],["DigiLocker","https://www.digilocker.gov.in"],["CPGRAMS जन शिकायत","https://pgportal.gov.in"],["RTI Online","https://rtionline.gov.in"]],"शिक्षा और परीक्षाएँ":[["UPSC","https://upsc.gov.in"],["SSC","https://ssc.gov.in"],["NTA","https://nta.ac.in"],["शिक्षा मंत्रालय","https://www.education.gov.in"],["NCERT","https://ncert.nic.in"],["DIKSHA","https://diksha.gov.in"],["SWAYAM","https://swayam.gov.in"],["UGC","https://www.ugc.gov.in"],["CBSE","https://www.cbse.gov.in"],["National Career Service","https://www.ncs.gov.in"]],"वित्त, कर और व्यापार":[["वित्त मंत्रालय","https://finmin.gov.in"],["आयकर ई-फाइलिंग","https://www.incometax.gov.in"],["GST","https://www.gst.gov.in"],["RBI","https://www.rbi.org.in"],["MCA","https://www.mca.gov.in"],["GeM","https://gem.gov.in"],["उद्योग आधार / Udyam","https://udyamregistration.gov.in"],["EPFO","https://www.epfindia.gov.in"],["ESIC","https://www.esic.gov.in"]],"पहचान और नागरिक सेवाएँ":[["UIDAI Aadhaar","https://uidai.gov.in"],["Passport Seva","https://www.passportindia.gov.in"],["Voters' Service Portal","https://voters.eci.gov.in"],["Election Commission","https://www.eci.gov.in"],["Parivahan","https://parivahan.gov.in"],["eCourts","https://ecourts.gov.in"],["India Post","https://www.indiapost.gov.in"],["Cyber Crime Reporting","https://cybercrime.gov.in"]],"स्वास्थ्य और कल्याण":[["स्वास्थ्य मंत्रालय","https://mohfw.gov.in"],["Ayushman Bharat PM-JAY","https://pmjay.gov.in"],["ABDM","https://abdm.gov.in"],["eSanjeevani","https://esanjeevani.mohfw.gov.in"],["National Health Portal","https://www.nhp.gov.in"],["महिला एवं बाल विकास","https://wcd.gov.in"],["e-Shram","https://eshram.gov.in"]],"कृषि, ग्रामीण और आवास":[["कृषि मंत्रालय","https://agriwelfare.gov.in"],["PM-KISAN","https://pmkisan.gov.in"],["eNAM","https://enam.gov.in"],["मौसम विभाग IMD","https://mausam.imd.gov.in"],["जल शक्ति मंत्रालय","https://jalshakti-dowr.gov.in"],["PMAY Urban","https://pmay-urban.gov.in"],["ग्रामीण विकास मंत्रालय","https://rural.gov.in"]],"मंत्रालय, संसद और आँकड़े":[["PM India","https://www.pmindia.gov.in"],["लोकसभा","https://sansad.in"],["गृह मंत्रालय","https://www.mha.gov.in"],["विदेश मंत्रालय","https://www.mea.gov.in"],["रक्षा मंत्रालय","https://mod.gov.in"],["इलेक्ट्रॉनिक्स एवं IT मंत्रालय","https://www.meity.gov.in"],["सांख्यिकी मंत्रालय","https://mospi.gov.in"],["पर्यावरण मंत्रालय","https://moef.gov.in"],["रेलवे","https://indianrailways.gov.in"],["ISRO","https://www.isro.gov.in"]]};const root=document.getElementById("directory"),q=document.getElementById("q"),count=document.getElementById("count");function draw(){root.replaceChildren();let n=0;const term=q.value.trim().toLocaleLowerCase();for(const [category,items] of Object.entries(groups)){const matches=items.filter(([name,url])=>(name+" "+url+" "+category).toLocaleLowerCase().includes(term));if(!matches.length)continue;const section=document.createElement("section"),heading=document.createElement("h2"),grid=document.createElement("div");heading.textContent=category;grid.className="grid";for(const [name,url] of matches){const a=document.createElement("a"),label=document.createElement("strong"),host=document.createElement("small");a.className="item";a.href=url;a.target="_blank";a.rel="noopener noreferrer";label.textContent=name+" ↗";host.textContent=new URL(url).hostname;a.append(label,host);grid.append(a);n++}section.append(heading,grid);root.append(section)}count.textContent=n+" पोर्टल मिले";}q.addEventListener("input",draw);draw();</script></body></html>

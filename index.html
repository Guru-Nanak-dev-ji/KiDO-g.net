/* A fitted dashboard: every home section has its own bounded grid row. */
html{height:100%;min-height:0;overflow:hidden;scroll-behavior:auto;overscroll-behavior:none}
body{height:100vh;height:100dvh;min-height:0;min-width:280px;overflow:hidden;display:grid;place-items:center;padding:max(7px,env(safe-area-inset-top)) max(9px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));overscroll-behavior:none}
.device{width:100%;max-width:550px;height:100%;min-height:0;margin:0;padding:6px;border-width:2px;border-radius:34px;box-shadow:0 0 0 1px #b66a0f,0 0 0 3px #4c2705,0 0 0 4px #f6b431,0 0 22px #ffab1870,inset 0 0 6px #fff2be}
.device::before{inset:4px;border-radius:28px}
.screen{height:100%;min-height:0;padding:17px 10px 5px;border-radius:27px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.1fr) clamp(31px,4.8dvh,40px) minmax(0,1.35fr) minmax(0,1.7fr) minmax(0,.6fr) clamp(45px,6.3dvh,58px);gap:6px;isolation:isolate}
.screen>*{min-width:0;min-height:0}
.notch{height:16px;left:33%;width:34%;gap:11px;border-radius:0 0 12px 12px}
.notch::before{width:34px;height:4px}.notch::after{width:6px;height:6px}
.motion-toggle{position:absolute;right:9px;top:3px;z-index:6;width:28px;height:28px;display:grid;place-items:center;border:1px solid #a77424;border-radius:50%;padding:5px;color:#ffdd8a;background:radial-gradient(circle,#382609,#0a0703);box-shadow:0 0 8px #ffbb3040}

/* Life is in the light and artwork; the buttons themselves stay steady. */
.ambient{animation:ambient-breath 9s ease-in-out infinite}

.temple-art::after{content:"";position:absolute;inset:55% -35% 0;background:linear-gradient(100deg,transparent 25%,#ffd65b33 48%,#fff2b557 50%,transparent 65%);mix-blend-mode:screen;animation:temple-water 9s ease-in-out infinite;pointer-events:none}

.kingdom-card::before{content:"";position:absolute;inset:-40% -70%;z-index:3;pointer-events:none;background:linear-gradient(112deg,transparent 44%,#fff0b525 49%,#fff4cb66 50%,#ffce5b22 51%,transparent 56%);transform:translateX(-60%);animation:card-glint 13s ease-in-out infinite}
.kingdom-card:nth-child(2)::before{animation-delay:-9s}.kingdom-card:nth-child(3)::before{animation-delay:-5s}.kingdom-card:nth-child(4)::before{animation-delay:-11s}.kingdom-card:nth-child(5)::before{animation-delay:-7s}.kingdom-card:nth-child(6)::before{animation-delay:-3s}
.small-card .artwork{animation:module-breathe 7s ease-in-out infinite}.small-card:nth-child(2) .artwork{animation-delay:-2s}.small-card:nth-child(3) .artwork{animation-delay:-4s}.small-card:nth-child(4) .artwork{animation-delay:-6s}
.kingdom-button::after{content:"";position:absolute;inset:-4px;border:1px solid #ffdf795c;border-radius:50%;pointer-events:none;animation:portal-pulse 4s ease-in-out infinite}
button.is-active{filter:brightness(1.3)}.chat-form:focus-within{border-color:#ffe8a6;box-shadow:0 0 0 2px #ffe29a30,inset 0 2px 7px #000}

/* The guardian is decorative: every control beneath it remains usable. */
#falcon-scene{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden;contain:layout style;isolation:isolate}
#falcon{position:absolute;left:0;top:0;width:clamp(64px,11vw,96px);aspect-ratio:160/132;pointer-events:none;opacity:0;transform:translate3d(-160px,-160px,0);filter:drop-shadow(0 2px 2px #000a) drop-shadow(0 0 5px #ffb52a66);will-change:transform;--falcon-tilt:0deg}
#falcon[data-ready="true"]{opacity:1;transition:opacity .35s}
.falcon-facing{position:relative;width:100%;height:100%;transform:rotate(var(--falcon-tilt));transform-origin:51% 65%}
#falcon[data-facing="left"] .falcon-facing{transform:rotate(var(--falcon-tilt)) scaleX(-1)}
#falcon svg{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible}
.falcon-flight{opacity:0}.falcon-perched{opacity:1}
#falcon[data-state="flying"] .falcon-flight,#falcon[data-state="takeoff"] .falcon-flight,#falcon[data-state="landing"] .falcon-flight{opacity:1}
#falcon[data-state="flying"] .falcon-perched,#falcon[data-state="takeoff"] .falcon-perched,#falcon[data-state="landing"] .falcon-perched{opacity:0}
.falcon-wing-near,.falcon-wing-far{transform-origin:87px 70px;animation:falcon-wingbeat .58s ease-in-out infinite;animation-play-state:paused}
.falcon-wing-far{animation-delay:-.08s;transform-origin:92px 65px}
#falcon[data-state="flying"] .falcon-wing-near,#falcon[data-state="flying"] .falcon-wing-far,#falcon[data-state="takeoff"] .falcon-wing-near,#falcon[data-state="takeoff"] .falcon-wing-far,#falcon[data-state="landing"] .falcon-wing-near,#falcon[data-state="landing"] .falcon-wing-far{animation-play-state:running}
#falcon[data-state="landing"] .falcon-wing-near,#falcon[data-state="landing"] .falcon-wing-far{animation-duration:.39s}
.falcon-head{transform-origin:101px 42px;animation:falcon-look 8s ease-in-out infinite}
.falcon-chest{transform-origin:84px 87px;animation:falcon-breathe 3.4s ease-in-out infinite}
#falcon[data-paused="true"] *,#falcon[data-motion="off"] *{animation-play-state:paused!important}
@keyframes falcon-wingbeat{0%,100%{transform:rotate(-6deg) scaleY(.97)}45%{transform:rotate(12deg) scaleY(-.58)}65%{transform:rotate(4deg) scaleY(-.18)}}
@keyframes falcon-look{0%,35%,65%,100%{transform:rotate(0)}43%,57%{transform:rotate(-7deg)}}
@keyframes falcon-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012,1.025)}}
@media(max-width:350px){#falcon{width:59px}}
@media(prefers-reduced-motion:reduce){#falcon{transition:none!important}.falcon-head,.falcon-chest,.falcon-wing-near,.falcon-wing-far{animation:none!important}}

/* KIDO-G decorative falcon: local animation only, no network or storage. */
(() => {
  'use strict';

  let enabled = true;
  let controller = null;
  window.isFalconMotionEnabled = () => enabled;
  window.setFalconMotion = value => {
    enabled = Boolean(value);
    if (controller) controller.sync();
    return enabled;
  };

  function init() {
    if (controller) return true;
    const bird = document.getElementById('falcon');
    const scene = document.getElementById('falcon-scene');
    if (!bird || !scene) return false;

    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    const viewport = window.visualViewport;
    const clamp = (n, low, high) => Math.max(low, Math.min(high, n));
    const random = (low, high) => low + Math.random() * (high - low);
    let width = 64, height = 53, bounds;
    let position = { x: 0, y: 0 };
    let anchorKey = null, anchors = [], recent = [];
    let paused, flight = null, frame = 0, layoutFrame = 0, restTimer = 0;
    let firstDeparture = true;

    function measure() {
      const box = bird.getBoundingClientRect();
      width = bird.offsetWidth || box.width || 64;
      height = bird.offsetHeight || box.height || width * 132 / 160;
      const left = viewport ? viewport.offsetLeft : 0;
      const top = viewport ? viewport.offsetTop : 0;
      const vw = viewport ? viewport.width : window.innerWidth;
      const vh = viewport ? viewport.height : window.innerHeight;
      bounds = {
        left: left + 8, top: top + 8,
        right: Math.max(left + 8, left + vw - width - 8),
        bottom: Math.max(top + 8, top + vh - height - 8),
        center: left + vw / 2, height: vh
      };
    }

    function collectAnchors() {
      const result = [];
      const frameNode = document.querySelector('.device, .phone');
      const rim = frameNode ? frameNode.getBoundingClientRect() : null;
      // SVG feet: (82, 117) in a 160 × 132 viewBox.
      function add(key, x, y) {
        const top = y - height * 117 / 132;
        if (top < bounds.top || top > bounds.bottom) return;
        if (x < bounds.left || x > bounds.right + width) return;
        const point = { key, x: clamp(x - width * 82 / 160, bounds.left, bounds.right), y: top };
        if (!result.some(a => Math.hypot(a.x - point.x, a.y - point.y) < 12)) result.push(point);
      }
      function each(selector, fn) {
        document.querySelectorAll(selector).forEach((node, index) => {
          const r = node.getBoundingClientRect();
          if (r.width && r.height) fn(r, index);
        });
      }
      function addRim(key, y, right) {
        const x = rim ? (right ? rim.right - 7 : rim.left + 7) :
          (right ? bounds.right + width : bounds.left);
        add(key, x, y);
      }
      each('.device, .phone', r => {
        add('frame-top-left', r.left + 12, r.top + 30);
        add('frame-top-right', r.right - 12, r.top + 30);
        add('frame-bottom-left', r.left + 13, r.bottom - 30);
        add('frame-bottom-right', r.right - 13, r.bottom - 30);
      });
      each('.temple-art, .palace', (r, i) => {
        add('palace-left-' + i, r.left + 6, r.top + r.height * .52);
        add('palace-right-' + i, r.right - 6, r.top + r.height * .52);
      });
      each('.ai-panel', (r, i) => {
        addRim('ai-left-' + i, r.top + height * .9, false);
        addRim('ai-right-' + i, r.top + height * .9, true);
      });
      each('.kingdom-card', (r, i) => {
        const column = i % 3;
        if (column === 1) return;
        // Keep the silhouette beside the artwork, below the tools above it.
        const y = r.top + height * .9;
        if (i === 0 || i === 5) add('card-' + i, column === 0 ? r.left + 3 : r.right - 3, y);
        else addRim('card-' + i, y, column === 2);
      });
      each('.small-card', (r, i) => {
        if (i === 0 || i === 3) addRim('small-' + i, r.top + height * .9, i === 3);
      });
      each('.orbit-art', (r, i) => {
        addRim('orbit-left-' + i, r.top + r.height * .65, false);
        addRim('orbit-right-' + i, r.top + r.height * .65, true);
      });
      each('.dock', (r, i) => {
        addRim('dock-left-' + i, r.top + 4, false);
        addRim('dock-right-' + i, r.top + 4, true);
      });
      return result.length ? result : [{ key: 'viewport-rim', x: bounds.right, y: bounds.top + 3 }];
    }

    function place(point) {
      position = { x: clamp(point.x, bounds.left, bounds.right), y: clamp(point.y, bounds.top, bounds.bottom) };
      bird.style.transform = `translate3d(${position.x.toFixed(2)}px,${position.y.toFixed(2)}px,0)`;
    }

    function park(preferred) {
      const target = preferred || anchors.find(a => a.key === anchorKey) ||
        anchors.reduce((best, a) => Math.hypot(a.x - position.x, a.y - position.y) <
          Math.hypot(best.x - position.x, best.y - position.y) ? a : best, anchors[0]);
      if (!target) return;
      anchorKey = target.key;
      place(target);
      bird.dataset.state = 'perched';
      bird.dataset.facing = position.x + width / 2 > bounds.center ? 'left' : 'right';
      bird.style.setProperty('--falcon-tilt', '0deg');
      bird.dataset.ready = 'true';
    }

    function cancelMotion() {
      if (frame) cancelAnimationFrame(frame);
      if (restTimer) clearTimeout(restTimer);
      frame = restTimer = 0;
      flight = null;
    }

    function availableTargets() {
      return anchors.filter(a => a.key !== anchorKey && Math.hypot(a.x - position.x, a.y - position.y) > width * .85);
    }

    function scheduleRest() {
      if (paused || flight || restTimer || !availableTargets().length) return;
      restTimer = setTimeout(() => {
        restTimer = 0;
        startFlight();
      }, firstDeparture ? 1500 : random(4000, 7000));
    }

    function makePath(target, now, duration) {
      const from = { ...position }, dx = target.x - from.x, dy = target.y - from.y;
      const lift = Math.min(bounds.height * .22, Math.max(height * .8, Math.hypot(dx, dy) * .22));
      const direction = Math.min(from.y, target.y) - lift < bounds.top ? 1 : -1;
      const safe = p => ({ x: clamp(p.x, bounds.left, bounds.right), y: clamp(p.y, bounds.top, bounds.bottom) });
      return {
        from, to: target, start: now, duration, deadline: now + duration,
        c1: safe({ x: from.x + dx * .25, y: from.y + dy * .2 + direction * lift }),
        c2: safe({ x: from.x + dx * .75, y: from.y + dy * .8 + direction * lift })
      };
    }

    function curve(path, t) {
      const u = 1 - t;
      return {
        x: u*u*u*path.from.x + 3*u*u*t*path.c1.x + 3*u*t*t*path.c2.x + t*t*t*path.to.x,
        y: u*u*u*path.from.y + 3*u*u*t*path.c1.y + 3*u*t*t*path.c2.y + t*t*t*path.to.y
      };
    }

    function tick(now) {
      frame = 0;
      if (paused || !flight) return;
      const t = clamp((now - flight.start) / flight.duration, 0, 1);
      const progress = .5 - .5 * Math.cos(Math.PI * t);
      const point = curve(flight, progress);
      const before = curve(flight, Math.max(0, progress - .015));
      const after = curve(flight, Math.min(1, progress + .015));
      const dx = after.x - before.x, dy = after.y - before.y;
      place(point);
      if (Math.abs(dx) > .1) bird.dataset.facing = dx < 0 ? 'left' : 'right';
      const tilt = Math.atan2(dy, Math.max(.1, Math.abs(dx))) * 180 / Math.PI * (dx < 0 ? -1 : 1);
      bird.style.setProperty('--falcon-tilt', clamp(tilt, -14, 14).toFixed(1) + 'deg');
      bird.dataset.state = t < .15 ? 'takeoff' : t > .82 ? 'landing' : 'flying';
      if (t >= 1) {
        const target = flight.to;
        flight = null;
        recent.push(target.key);
        recent = recent.slice(-2);
        park(target);
        scheduleRest();
      } else frame = requestAnimationFrame(tick);
    }

    function startFlight() {
      if (paused) return;
      measure();
      anchors = collectAnchors();
      let choices = availableTargets();
      if (!choices.length) return;
      const fresh = choices.filter(a => !recent.includes(a.key));
      if (fresh.length) choices = fresh;
      const target = choices[Math.floor(Math.random() * choices.length)];
      firstDeparture = false;
      flight = makePath(target, performance.now(), random(3000, 5000));
      bird.dataset.state = 'takeoff';
      frame = requestAnimationFrame(tick);
    }

    function rebase() {
      layoutFrame = 0;
      measure();
      anchors = collectAnchors();
      if (flight && !paused) {
        const target = anchors.find(a => a.key === flight.to.key) || anchors[0];
        const now = performance.now();
        place(position);
        flight = makePath(target, now, Math.max(250, flight.deadline - now));
      } else {
        park();
        scheduleRest();
      }
    }

    function queueLayout() {
      if (!document.hidden && !layoutFrame) layoutFrame = requestAnimationFrame(rebase);
    }

    function sync() {
      const active = document.activeElement;
      const typing = active && (active.isContentEditable || active.matches('input:not([type="hidden"]),textarea,select'));
      const next = !enabled || reduce.matches || document.hidden || Boolean(typing) || Boolean(document.querySelector('dialog[open]'));
      bird.dataset.paused = String(next);
      bird.dataset.motion = next ? 'off' : 'on';
      if (next === paused) return;
      paused = next;
      if (paused) {
        cancelMotion();
        if (document.hidden && layoutFrame) { cancelAnimationFrame(layoutFrame); layoutFrame = 0; }
        measure();
        anchors = collectAnchors();
        park();
      } else rebase();
    }

    controller = { sync };
    measure();
    anchors = collectAnchors();
    park(anchors.find(a => a.key.startsWith('palace-right')) || anchors[0]);
    sync();
    document.addEventListener('visibilitychange', sync);
    document.addEventListener('focusin', sync);
    document.addEventListener('focusout', () => queueMicrotask(sync));
    document.addEventListener('scroll', queueLayout, { passive: true, capture: true });
    window.addEventListener('resize', queueLayout, { passive: true });
    window.addEventListener('pageshow', () => { sync(); queueLayout(); });
    window.addEventListener('pagehide', () => {
      cancelMotion();
      if (layoutFrame) cancelAnimationFrame(layoutFrame);
      layoutFrame = 0;
      paused = true;
    });
    if (viewport) {
      viewport.addEventListener('resize', queueLayout, { passive: true });
      viewport.addEventListener('scroll', queueLayout, { passive: true });
    }
    if (reduce.addEventListener) reduce.addEventListener('change', sync);
    else reduce.addListener(sync);
    new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['open'], subtree: true });
    if (window.ResizeObserver) {
      const observer = new ResizeObserver(queueLayout);
      document.querySelectorAll('.device,.phone,.ai-panel').forEach(node => observer.observe(node));
    }
    return true;
  }

  function boot() {
    if (init()) return;
    const waiting = new MutationObserver(() => { if (init()) waiting.disconnect(); });
    waiting.observe(document.documentElement, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
  else boot();
})();

/* Local master motion and compact-screen interaction state. Load after Falcon. */
(() => {
  'use strict';
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  let enabled = true, ready = false, baseline = 0, lastWidth = 0;
  let pressed = null, pressTimer = 0;
  const active = () => enabled && !reduced.matches && !document.hidden;
  window.isSceneMotionEnabled = () => enabled;
  window.isSceneMotionActive = active;
  window.isSceneMotionReduced = () => reduced.matches;
  window.setSceneMotion = value => {
    enabled = Boolean(value);
    if (ready) applyMotion();
    return enabled;
  };

  function applyMotion() {
    const playing = active();
    document.body.dataset.motion = playing ? 'on' : 'off';
    document.body.dataset.reducedMotion = String(reduced.matches);
    // Falcon independently honors visibility, reduced motion and editing focus.
    if (typeof window.setFalconMotion === 'function') window.setFalconMotion(enabled);
    const toggle = document.getElementById('motion-toggle');
    if (toggle) {
      toggle.dataset.motion = playing ? 'on' : 'off';
      toggle.dataset.state = playing ? 'playing' : 'paused';
      toggle.setAttribute('aria-pressed', String(playing));
      toggle.setAttribute('aria-label', reduced.matches
        ? 'डिवाइस की कम हलचल सेटिंग सक्रिय है'
        : playing ? 'हलचल रोकें' : 'हलचल चालू करें');
      toggle.disabled = reduced.matches;
    }
    window.dispatchEvent(new CustomEvent('scene-motion-change', {
      detail: { enabled, active: playing, reduced: reduced.matches }
    }));
  }

  function isEditing() {
    const node = document.activeElement;
    return Boolean(node && (node.isContentEditable || node.tagName === 'TEXTAREA' ||
      (node.tagName === 'INPUT' && !/^(hidden|button|submit|reset|file|checkbox|radio|range|color|image)$/i.test(node.type))));
  }

  function updateKeyboard() {
    const viewport = window.visualViewport;
    const height = viewport ? viewport.height : window.innerHeight;
    const width = window.innerWidth;
    const editing = isEditing();
    if (!editing || Math.abs(width - lastWidth) > 64) baseline = Math.max(height, window.innerHeight);
    else baseline = Math.max(baseline, height);
    lastWidth = width;
    document.body.classList.toggle('keyboard-open', Boolean(viewport && editing && height < baseline * .78));
    updateQuiet();
  }

  function updateQuiet() {
    document.body.dataset.quiet = String(isEditing() || Boolean(document.querySelector('dialog[open]')));
  }

  function clearPress() {
    if (pressed) pressed.classList.remove('is-active');
    pressed = null;
    clearTimeout(pressTimer);
  }

  function init() {
    if (ready || !document.body) return;
    ready = true;
    baseline = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    lastWidth = window.innerWidth;
    const toggle = document.getElementById('motion-toggle');
    if (toggle) toggle.addEventListener('click', () => window.setSceneMotion(!enabled));
    document.addEventListener('visibilitychange', () => { applyMotion(); if (document.hidden) clearPress(); });
    document.addEventListener('focusin', updateKeyboard);
    document.addEventListener('focusout', () => queueMicrotask(updateKeyboard));
    window.addEventListener('resize', updateKeyboard, { passive: true });
    window.addEventListener('pageshow', () => { applyMotion(); updateKeyboard(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', updateKeyboard, { passive: true });
    new MutationObserver(updateQuiet).observe(document.documentElement, { attributes: true, attributeFilter: ['open'], subtree: true });
    if (reduced.addEventListener) reduced.addEventListener('change', applyMotion);
    else reduced.addListener(applyMotion);
    document.addEventListener('pointerdown', event => {
      const button = event.target.closest && event.target.closest('button');
      if (!button || button.disabled) return;
      clearPress();
      pressed = button;
      button.classList.add('is-active');
      pressTimer = setTimeout(clearPress, 180);
    }, { passive: true });
    document.addEventListener('pointercancel', clearPress, { passive: true });
    window.addEventListener('blur', clearPress);
    applyMotion();
    updateKeyboard();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
  else init();
})();

</script>

<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100801"><title>KIDO-G | Quantum Kingdom</title><style>
:root{--gold:#fbd475;--border:#b78029}*{box-sizing:border-box}html,body{margin:0;background:#080506;color:#fff0c7;font-family:system-ui,"Noto Sans Devanagari",sans-serif}body{background:radial-gradient(ellipse at 50% 15%,#774615 0,#160b05 45%,#030407 90%)}button,input{font:inherit}.kingdom{max-width:490px;margin:auto;min-height:100dvh;padding:12px 11px 8px;position:relative;border:5px ridge #d8a344;border-radius:32px;background:radial-gradient(ellipse at 50% 0,#50310f77,#090706 45%,#150c07);box-shadow:inset 0 0 0 3px #50300e,inset 0 0 30px #b98137,0 0 26px #b88132}.kingdom:before{content:"";position:absolute;inset:4px;border:1px solid #e7bf6a80;border-radius:27px;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:center;gap:7px}.seal{width:76px;height:76px;border-radius:50%;border:3px double #ffe39b;box-shadow:0 0 14px #db9d39;background:radial-gradient(circle at 35% 30%,#4b36ac,#140b24 64%,#965510);display:grid;place-items:center;font-size:44px;text-shadow:0 0 8px #b98cff}.globe{background:radial-gradient(circle at 32% 25%,#9ffcff,#187ec0 36%,#022858 65%,#07111b);font-size:37px;animation:glow 5s ease-in-out infinite}.identity{text-align:center;flex:1;min-width:0}.brand{font-size:clamp(29px,8vw,42px);font-weight:1000;white-space:nowrap;line-height:1.2;letter-spacing:-1px;color:#ffe29a;text-shadow:0 2px #693a0b,0 0 13px #ffb843}.identity strong{display:block;font-size:13px;margin:2px 0}.identity small{display:block;font-size:9px;letter-spacing:1.5px;font-weight:800}.palace{height:118px;position:relative;overflow:hidden;border-radius:8px;margin:6px 2px 8px;background:radial-gradient(ellipse at 50% 95%,#ffe78c 0,#b55b0b 30%,#190c19 80%);border-bottom:3px solid #e7b95b}.palace:before{content:"ੴ";position:absolute;z-index:2;left:0;right:0;text-align:center;top:-5px;color:#ffe6a4;font-size:48px;text-shadow:0 0 13px #ffc85e}.architecture{position:absolute;inset:0;display:flex;justify-content:center;align-items:end;gap:3px;filter:drop-shadow(0 0 8px #f6ac3b)}.minaret{width:11%;height:59%;border:2px solid #f6cf70;border-radius:45% 45% 0 0;background:repeating-linear-gradient(90deg,#754009,#ffe19c 8px,#b4711e 15px)}.minaret:before{content:"";display:block;position:relative;top:-19px;width:100%;height:23px;border-radius:50% 50% 0 0;background:linear-gradient(90deg,#99500a,#ffe68c,#a96312)}.central{width:42%;height:75%;position:relative;border:2px solid #ffdc7c;border-radius:45% 45% 0 0;background:repeating-linear-gradient(90deg,#9a5513 0 8px,#ffd17a 10px 18px,#85430d 20px)}.central:after{content:"";position:absolute;bottom:0;left:34%;width:32%;height:46%;border:4px solid #ffe3a1;border-radius:55% 55% 0 0;background:#341505}.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:7px 0}.menu button,.tools button{border:1px solid #bd8637;background:linear-gradient(#302011,#100b0a);color:#f6dc9f;border-radius:12px;min-height:43px;font-size:11px}.assistant{border:3px double #e7b35d;border-radius:27px;background:linear-gradient(135deg,#3d220d,#09090b 70%);padding:9px;box-shadow:0 0 15px #c9913370,inset 0 0 15px #af722a40}.assistant-top{display:flex;gap:10px;align-items:center}.avatar{width:80px;height:84px;flex-shrink:0;border:2px solid #c99646;border-radius:20px;background:radial-gradient(circle at 50% 32%,#ffd7a5 0 20%,#1c6fa3 22% 49%,#070e25 52%);display:grid;place-items:end center;font-size:36px;overflow:hidden}.assistant-title{font-size:30px;color:#ffe0a0;font-weight:900}.assistant-title small{font-size:12px;font-weight:400;display:block;color:#eee}.ask{display:flex;gap:5px;align-items:center;border:1px solid #edbd66;border-radius:35px;background:#101319;margin:8px 0;padding:6px}.ask input{background:none;border:0;color:white;outline:0;min-width:0;flex:1;font-size:15px}.ask button{border:0;border-radius:50%;width:43px;height:43px;background:linear-gradient(#ffdf87,#e68423);font-size:20px}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.tools button{min-height:35px;font-size:10px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:11px 2px}.tile{overflow:hidden;border:2px ridge #d5a14b;border-radius:17px;background:linear-gradient(#553014,#100d0b);padding:0;color:#fff2ce;box-shadow:inset 0 0 12px #dd963d,0 0 7px #d38b2b60;cursor:pointer}.art{height:clamp(74px,17vw,102px);position:relative;display:grid;place-items:center;font-size:52px;text-shadow:0 0 12px #ffc351,0 4px 6px #000;background:radial-gradient(circle at 50% 42%,#e8a837aa,#2b1833 52%,#030a14)}.tile:nth-child(3n+1) .art{background:radial-gradient(circle,#39b7e777,#092b59 45%,#130d10 85%)}.tile:nth-child(3n+2) .art{background:radial-gradient(circle,#ffc23a99,#55240c 50%,#090808 90%)}.tile:nth-child(3n) .art{background:radial-gradient(circle,#e2a13199,#5c230c 55%,#070709 90%)}.art:after{content:"";position:absolute;inset:5px;border:1px solid #e8bc5a80;border-radius:10px}.tile strong{display:block;font-size:11px;padding:4px 1px 0}.tile small{display:block;color:#e4bd81;font-size:9px;padding:2px 1px 6px}.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 2px}.mini .art{height:65px;font-size:36px}.mini .tile{border-radius:13px}.mini .tile strong{font-size:9px;padding:5px 1px}.bottom{display:flex;align-items:center;justify-content:space-around;border:2px solid #c9943f;border-radius:45px;padding:6px;background:linear-gradient(#4b2c10,#090807);box-shadow:0 0 15px #e1a443}.bottom button{border:0;background:transparent;color:#ffdd91;font-size:11px;display:grid;place-items:center;gap:2px}.bottom button b{font-size:23px}.bottom .khanda{font-size:36px;border:3px solid #f9d784;width:58px;height:58px;border-radius:50%;background:#50300e;box-shadow:0 0 14px #ffc455}.dialogback{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:20px;z-index:5}.dialogback.open{display:grid}.dialog{max-width:390px;border:2px solid #e4ae56;background:#1e130c;border-radius:17px;padding:22px;text-align:center}.dialog button{padding:9px 24px;background:#e6af52;border:0;border-radius:10px}@keyframes glow{50%{box-shadow:0 0 25px #5dd9ff,0 0 13px #e9aa40}}@media(max-width:350px){.seal{width:60px;height:60px;font-size:32px}.assistant-title{font-size:25px}.avatar{width:62px}.menu button{font-size:9px}.tile small{font-size:8px}}
</style></head><body><main class="kingdom"><header class="top"><div class="seal" aria-label="Khalsa horse">♞</div><div class="identity"><div class="brand">KID🥭-G</div><strong>आपका AI साथी</strong><small>KHATRI DIGITAL NETWORK</small></div><div class="seal globe" aria-label="India globe">🌏</div></header><div class="palace"><div class="architecture"><div class="minaret"></div><div class="minaret"></div><div class="central"></div><div class="minaret"></div><div class="minaret"></div></div></div><nav class="menu"><button data-name="Home">⌂ Home</button><button data-name="KDN">🌐 KDN</button><button data-name="Farming">♧ Farming</button><button data-name="Business">▣ Business</button><button data-name="More">▦ More</button></nav><section class="assistant"><div class="assistant-top"><div class="avatar" aria-label="AI assistant avatar">👳</div><div class="assistant-title">पूछिए…<small>Ask · Search · Create · Learn</small></div></div><form class="ask" id="ask"><button type="button" data-name="Add files">＋</button><input id="q" placeholder="अपनी बात लिखिए…" aria-label="अपनी बात लिखिए"><button type="button" data-name="Microphone">🎙</button><button type="submit">➤</button></form><div class="tools"><button data-name="Web Search">🌐 Web Search</button><button data-name="Files">▤ Files</button><button data-name="Deep Think">✺ Deep Think</button><button data-name="Tools">⚒ Tools</button></div></section><section class="tiles" id="tiles"></section><section class="mini" id="mini"></section><nav class="bottom"><button data-name="Home"><b>⌂</b>Home</button><button data-name="Chat"><b>☏</b>Chat</button><button class="khanda" data-name="Khalsa">☬</button><button data-name="Search"><b>⌕</b>Search</button><button data-name="Menu"><b>▦</b>Menu</button></nav></main><div class="dialogback" id="overlay"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="close">बंद करें</button></div></div><script>
const entries=[['📰','NEWS','World · India · Punjab'],['📚','UPSC','Study · Exam · Current'],['🏛️','GOVERNMENT','Schemes · Jobs · Portals'],['🌐','SOCIAL SEARCH','People · Trends · Media'],['📜','WRITER ACADEMY','Write · Learn · Publish'],['🎨','CREATIVE STUDIO','Images · Videos · Apps'],['🤖','AI AGENTS',''],['👨‍👩‍👧','FAMILY & GOTRA',''],['📈','BUSINESS',''],['✿','TOOLS & MORE','']];function openModal(name){document.getElementById('modalTitle').textContent=name;document.getElementById('modalText').textContent='यह सुविधा निर्माणाधीन है। अभी वास्तविक AI, लॉगिन, समाचार और अन्य बाहरी सेवाएँ कनेक्ट नहीं हैं।';document.getElementById('overlay').classList.add('open')}entries.forEach(([icon,name,desc],i)=>{let el=document.createElement('button');el.className='tile';el.innerHTML='<div class="art">'+icon+'</div><strong>'+name+'</strong>'+(desc?'<small>'+desc+'</small>':'');el.onclick=()=>openModal(name);document.getElementById(i<6?'tiles':'mini').appendChild(el)});document.querySelectorAll('[data-name]').forEach(x=>x.addEventListener('click',()=>openModal(x.dataset.name)));document.getElementById('ask').onsubmit=e=>{e.preventDefault();openModal('KIDO-G AI Assistant')};document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.target.classList.remove('open')};
</script><script defer src="./brahma-preview.js"></script></body></html>
